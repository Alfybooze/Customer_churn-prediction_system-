<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Churn Prediction System for banks</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .container {
            background: rgba(30, 30, 46, 0.95);
            backdrop-filter: blur(15px);
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 550px;
            border: 1px solid rgba(99, 102, 241, 0.2);
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #f8fafc;
            margin-bottom: 25px;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #8b5cf6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        input,
        select {
            padding: 14px 16px;
            border: 2px solid #374151;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            background: rgba(17, 24, 39, 0.8);
            color: #f8fafc;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
            background: rgba(17, 24, 39, 0.95);
        }

        input::placeholder {
            color: #6b7280;
            font-style: italic;
        }

        select {
            cursor: pointer;
        }

        select option {
            background: #1f2937;
            color: #f8fafc;
            padding: 8px;
        }

        button {
            padding: 16px;
            background: linear-gradient(135deg, #8b5cf6 0%, #06b6d4 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            margin-top: 15px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.4);
        }

        button:active {
            transform: translateY(0px);
        }

        .result {
            margin-top: 25px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            color: #f8fafc;
            padding: 18px;
            border-radius: 12px;
            background: rgba(139, 92, 246, 0.1);
            border: 2px solid rgba(139, 92, 246, 0.3);
            display: none;
        }

        .result.show {
            display: block;
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-icon {
            position: relative;
        }

        .input-icon::before {
            content: '';
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            z-index: 1;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 640px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 25px 20px;
                margin: 0;
                border-radius: 20px;
            }

            h1 {
                font-size: 1.7rem;
                margin-bottom: 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            form {
                gap: 15px;
            }

            input,
            select {
                padding: 12px 14px;
                font-size: 0.9rem;
            }

            button {
                padding: 14px;
                font-size: 0.95rem;
            }

            .section-title {
                font-size: 1rem;
                margin: 20px 0 12px 0;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px 15px;
            }

            h1 {
                font-size: 1.5rem;
            }

            input,
            select {
                padding: 11px 12px;
            }

            button {
                padding: 12px;
            }
        }

        @media (max-width: 360px) {
            h1 {
                font-size: 1.4rem;
            }

            .container {
                padding: 18px 12px;
            }
        }

        .section-title {
            color: #e2e8f0;
            font-size: 1.05rem;
            font-weight: 700;
            margin: 22px 0 12px 0;
            padding-bottom: 8px;
            border-bottom: 2px solid rgba(139, 92, 246, 0.3);
        }

        .section-title:first-of-type {
            margin-top: 0;
        }

        .batch-upload {
            margin-top: 15px;
        }

        .file-label {
            display: block;
            padding: 16px;
            background: rgba(17, 24, 39, 0.8);
            border: 2px dashed #374151;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #cbd5e1;
            font-weight: 600;
        }

        .file-label:hover {
            border-color: #8b5cf6;
            background: rgba(17, 24, 39, 0.95);
        }

        .file-label span {
            display: block;
            font-size: 1rem;
        }

        .batch-result {
            margin-top: 20px;
            display: none;
        }

        .batch-result.show {
            display: block;
            animation: fadeInUp 0.5s ease;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: rgba(17, 24, 39, 0.8);
            border-radius: 12px;
            overflow: hidden;
        }

        .results-table th,
        .results-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #374151;
            color: #f8fafc;
        }

        .results-table th {
            background: rgba(139, 92, 246, 0.2);
            font-weight: 700;
            color: #e2e8f0;
        }

        .results-table tr:last-child td {
            border-bottom: none;
        }

        .results-table tr:hover {
            background: rgba(139, 92, 246, 0.1);
        }

        .churn-yes {
            color: #f87171;
            font-weight: 600;
        }

        .churn-no {
            color: #34d399;
            font-weight: 600;
        }

        .download-btn {
            margin-top: 15px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }

        .table-container {
            max-height: 400px;
            overflow-y: auto;
            border-radius: 12px;
        }

        .table-container::-webkit-scrollbar {
            width: 8px;
        }

        .table-container::-webkit-scrollbar-track {
            background: rgba(17, 24, 39, 0.5);
            border-radius: 4px;
        }

        .table-container::-webkit-scrollbar-thumb {
            background: #8b5cf6;
            border-radius: 4px;
        }

        .table-container::-webkit-scrollbar-thumb:hover {
            background: #7c3aed;
        }

        .summary-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(17, 24, 39, 0.8);
            padding: 20px;
            border-radius: 12px;
            border: 2px solid rgba(139, 92, 246, 0.3);
        }

        .stat-card h3 {
            font-size: 0.9rem;
            color: #cbd5e1;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-card.churn .stat-value {
            color: #f87171;
        }

        .stat-card.no-churn .stat-value {
            color: #34d399;
        }

        .stat-percentage {
            font-size: 0.85rem;
            color: #9ca3af;
        }

        @media (max-width: 640px) {
            .summary-stats {
                grid-template-columns: 1fr;
                gap: 12px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>💲Bank Churn Prediction</h1>
        <form id="predictionForm">
            <div class="section-title">Personal Information</div>

            <div class="form-row">
                <div class="form-group">
                    <label for="creditScore">Credit Score:</label>
                    <input type="number" id="creditScore" placeholder="e.g., 600" required>
                </div>

                <div class="form-group">
                    <label for="age">Age:</label>
                    <input type="number" id="age" placeholder="e.g., 40" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="geography">Geography:</label>
                    <select id="geography" required>
                        <option value="France">France</option>
                        <option value="Spain">Spain</option>
                        <option value="Germany">Germany</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="gender">Gender:</label>
                    <select id="gender" required>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
            </div>

            <div class="section-title">Account Details</div>

            <div class="form-row">
                <div class="form-group">
                    <label for="tenure">Tenure (years):</label>
                    <input type="number" id="tenure" placeholder="e.g., 3" required>
                </div>

                <div class="form-group">
                    <label for="numOfProducts">Number of Products:</label>
                    <input type="number" id="numOfProducts" placeholder="e.g., 2" required>
                </div>
            </div>

            <div class="form-group">
                <label for="balance">Account Balance($):</label>
                <input type="number" id="balance" placeholder="e.g., 60000" required>
            </div>

            <div class="form-group">
                <label for="estimatedSalary">Estimated Annual Salary($):</label>
                <input type="number" id="estimatedSalary" placeholder="e.g., 50000" required>
            </div>

            <div class="section-title">Membership Status</div>

            <div class="form-row">
                <div class="form-group">
                    <label for="hasCrCard">Has Credit Card:</label>
                    <select id="hasCrCard" required>
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="isActiveMember">Is Active Member:</label>
                    <select id="isActiveMember" required>
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>
            </div>

            <button type="submit">Predict Churn Risk</button>
        </form>
        <div class="result" id="result"></div>

        <div class="section-title" style="margin-top: 35px;">Batch Prediction</div>
        <div class="batch-upload">
            <label for="csvFile" class="file-label">
                <span>📄 Upload CSV File</span>
                <input type="file" id="csvFile" accept=".csv" style="display: none;">
            </label>
            <button id="processCsv"
                style="margin-top: 15px; background: linear-gradient(135deg, #06b6d4 0%, #8b5cf6 100%);">Process
                CSV</button>
        </div>
        <div id="batchResult" class="batch-result"></div>
    </div>

    <script>
        let csvData = null;

        // Handle file upload
        document.getElementById('csvFile').addEventListener('change', function (event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const text = e.target.result;
                    csvData = parseCSV(text);
                    document.querySelector('.file-label span').textContent = `✅ ${file.name} (${csvData.length} rows)`;
                };
                reader.readAsText(file);
            }
        });

        // Parse CSV
        function parseCSV(text) {
            const lines = text.trim().split('\n');
            const headers = lines[0].split(',').map(h => h.trim());
            const data = [];

            // keys that indicate an id / row number column (normalized)
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue; // Skip empty lines

                const values = line.split(',');
                const row = {};

                // Create object with header-value pairs
                for (let j = 0; j < headers.length; j++) {
                    row[headers[j]] = values[j] ? values[j].trim() : '';
                }

                data.push(row);
            }

            return data;
        }

        function normalizeKey(k) {
            return String(k || '').trim().replace(/[_\s]/g, '').toLowerCase();
        }

        // Safe value getter from a row object. Accepts multiple possible header names.
        function getVal(row, possibleKeys, defaultVal = '') {
            for (const k of possibleKeys) {
                if (k in row && row[k] !== undefined && row[k] !== '') return row[k];
            }
            // try normalized keys
            const normalized = Object.keys(row).reduce((acc, key) => {
                acc[normalizeKey(key)] = row[key];
                return acc;
            }, {});
            for (const k of possibleKeys) {
                const nk = normalizeKey(k);
                if (nk in normalized && normalized[nk] !== undefined && normalized[nk] !== '') return normalized[nk];
            }
            return defaultVal;
        }
        function toBinary(val) {
            if (val === undefined || val === null) return 0;
            const s = String(val).trim().toLowerCase();
            if (s === '1' || s === 'yes' || s === 'true' || s === 'y' || s === 't') return 1;
            return 0;
        }
        function buildFeatureArray(row) {
            // Accept many header naming variants for robustness
            const creditScore = Number(getVal(row, ['CreditScore', 'creditscore', 'credit_score'], 600));
            const geographyRaw = String(getVal(row, ['Geography', 'geography'], 'France')).trim();
            const genderRaw = String(getVal(row, ['Gender', 'gender', 'Sex'], 'Female')).trim();

            // label encoding: drop France (base). Keep Spain and Germany.
            let geography_encoded = 0; // Default to France
            if (geographyRaw.toLowerCase() === 'spain') {
                geography_encoded = 2;
            } else if (geographyRaw.toLowerCase() === 'germany') {
                geography_encoded = 1;
            }

            // One-hot for gender (drop Female)
            const gender_male = genderRaw.toLowerCase() === 'male' ? 1 : 0;

            const age = Number(getVal(row, ['Age', 'age'], 40));
            const tenure = Number(getVal(row, ['Tenure', 'tenure', 'YearsWithBank'], 3));
            const balance = Number(getVal(row, ['Balance', 'balance', 'AccountBalance'], 0));
            const numOfProducts = Number(getVal(row, ['NumOfProducts', 'numofproducts', 'num_of_products'], 1));

            const hasCrCard = toBinary(getVal(row, ['HasCrCard', 'hascrcard', 'HasCreditCard', 'hascreditcard'], 'No'));
            const isActiveMember = toBinary(getVal(row, ['IsActiveMember', 'isactivemember', 'IsActive'], 'No'));

            const estimatedSalary = Number(getVal(row, ['EstimatedSalary', 'estimatedsalary', 'Salary', 'AnnualSalary'], 0));

            // Validate numeric fields and return null if critical missing
            if (Number.isNaN(creditScore) || Number.isNaN(age) || Number.isNaN(tenure) || Number.isNaN(balance)) {
                // invalid row -> skip it by returning null
                return null;
            }

            return [
                creditScore,
                geography_encoded,
                gender_male,
                age,
                tenure,
                balance,
                numOfProducts,
                hasCrCard,
                isActiveMember,
                estimatedSalary
            ];
        }
        // Process CSV
        document.getElementById('processCsv').addEventListener('click', async function () {
            if (!csvData) {
                alert('Please upload a CSV file first');
                return;
            }

            const batchResultDiv = document.getElementById('batchResult');
            batchResultDiv.innerHTML = '<p style="color: #cbd5e1; text-align: center; padding: 20px;">Processing predictions...</p>';
            batchResultDiv.classList.add('show');

            // Prepare batch features array
            const batchFeatures = [];
            const originalRows = [];
            const skippedRows = [];

            // Build features, skip rows that don't produce a valid feature vector
            for (let i = 0; i < csvData.length; i++) {
                const row = csvData[i];
                const features = (typeof buildFeatureArray === 'function') ? buildFeatureArray(row) : localBuildFeatureArray(row);
                if (!features || !Array.isArray(features)) {
                    skippedRows.push({ index: i, row });
                    continue;
                }
                batchFeatures.push(features);
                originalRows.push(row);
            }

            if (batchFeatures.length === 0) {
                batchResultDiv.innerHTML = `<p style="color: #f87171; text-align: center; padding: 20px;">No valid rows found to predict. ${skippedRows.length} row(s) skipped.</p>`;
                return;
            }

            try {
                // Send batch request to backend
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ features: batchFeatures })
                });

                const data = await response.json();

                if (response.ok && data.batch_results) {
                    // Combine original rows with predictions
                    const results = data.batch_results.map((result, index) => ({
                        ...originalRows[index],
                        Prediction: result.prediction,
                        Probability: result.probability
                    }));

                    displayResults(results, data.summary);
                } else {
                    batchResultDiv.innerHTML = `<p style="color: #f87171; text-align: center; padding: 20px;">Error: ${data.error || 'Unknown error'}</p>`;
                }
            } catch (error) {
                batchResultDiv.innerHTML = `<p style="color: #f87171; text-align: center; padding: 20px;">Error: ${error.message}</p>`;
            }
        });

        // Display results in table
        function displayResults(results, summary) {
            const batchResultDiv = document.getElementById('batchResult');

            let html = '';

            // Display summary statistics if available
            if (summary) {
                html += `
                    <div class="summary-stats">
                        <div class="stat-card churn">
                            <h3>Will Churn</h3>
                            <div class="stat-value">${summary.churn_count}</div>
                            <div class="stat-percentage">${summary.churn_percentage}% of total</div>
                        </div>
                        <div class="stat-card no-churn">
                            <h3>Won't Churn</h3>
                            <div class="stat-value">${summary.no_churn_count}</div>
                            <div class="stat-percentage">${summary.no_churn_percentage}% of total</div>
                        </div>
                    </div>
                `;
            }

            html += `
                <div class="table-container">
                    <table class="results-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Credit Score</th>
                                <th>Age</th>
                                <th>Geography</th>
                                <th>Prediction</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            results.forEach((result, index) => {
                const predictionClass = result.Prediction.includes("won't leave") ? 'churn-yes' : 'churn-no';
                const shortPrediction = result.Prediction.includes("won't leave") ? 'Won\'t Churn' : 'Will Churn';
                html += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${result.CreditScore || result.creditScore}</td>
                        <td>${result.Age || result.age}</td>
                        <td>${result.Geography || result.geography}</td>
                        <td class="${predictionClass}">${shortPrediction}</td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
                <button class="download-btn" onclick="downloadResults()">Download Results</button>
            `;

            batchResultDiv.innerHTML = html;
            window.batchResults = results; // Store for download
        }

        // Download results as CSV
        function downloadResults() {
            if (!window.batchResults) return;

            const headers = Object.keys(window.batchResults[0]);
            const csvContent = [
                headers.join(','),
                ...window.batchResults.map(row =>
                    headers.map(header => row[header]).join(',')
                )
            ].join('\n');

            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'churn_predictions.csv';
            a.click();
            window.URL.revokeObjectURL(url);
        }

        // Single prediction form
        document.getElementById('predictionForm').addEventListener('submit', async function (event) {
            event.preventDefault();

            // Adjusted one-hot encoding for Geography (drop 'France')
            const geography = document.getElementById('geography').value;
            let geography_encoded = 0; // Default to France
            if (geography === 'Spain') {
                geography_encoded = 2;
            } else if (geography === 'Germany') {
                geography_encoded = 1;
            }

            // Adjusted one-hot encoding for Gender (drop 'Female')
            const gender = document.getElementById('gender').value;
            const genderOneHot = [
                gender === 'Male' ? 1 : 0 // Male
            ];

            // Convert 'Has Credit Card' and 'Is Active Member' to 1 or 0
            const hasCrCard = document.getElementById('hasCrCard').value === 'Yes' ? 1 : 0;
            const isActiveMember = document.getElementById('isActiveMember').value === 'Yes' ? 1 : 0;

            const featuresArray = [
                Number(document.getElementById('creditScore').value),
                geography_encoded,
                ...genderOneHot,
                Number(document.getElementById('age').value),
                Number(document.getElementById('tenure').value),
                Number(document.getElementById('balance').value),
                Number(document.getElementById('numOfProducts').value),
                hasCrCard,
                isActiveMember,
                Number(document.getElementById('estimatedSalary').value)
            ];

            // Show loading state
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = 'Analyzing...';
            resultDiv.classList.add('show');

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ features: featuresArray })
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.textContent = `Prediction: ${data.prediction}`;
                } else {
                    resultDiv.textContent = `Error: ${data.error}`;
                }
            } catch (error) {
                resultDiv.textContent = `Error: ${error.message}`;
            }
        });

    </script>
</body>

</html>
