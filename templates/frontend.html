<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Churn Prediction</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .container {
            background: rgba(30, 30, 46, 0.95);
            backdrop-filter: blur(15px);
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 550px;
            border: 1px solid rgba(99, 102, 241, 0.2);
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #f8fafc;
            margin-bottom: 25px;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #8b5cf6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        input, select {
            padding: 14px 16px;
            border: 2px solid #374151;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            background: rgba(17, 24, 39, 0.8);
            color: #f8fafc;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
            background: rgba(17, 24, 39, 0.95);
        }

        input::placeholder {
            color: #6b7280;
            font-style: italic;
        }

        select {
            cursor: pointer;
        }

        select option {
            background: #1f2937;
            color: #f8fafc;
            padding: 8px;
        }

        button {
            padding: 16px;
            background: linear-gradient(135deg, #8b5cf6 0%, #06b6d4 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            margin-top: 15px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.4);
        }

        button:active {
            transform: translateY(0px);
        }

        .result {
            margin-top: 25px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            color: #f8fafc;
            padding: 18px;
            border-radius: 12px;
            background: rgba(139, 92, 246, 0.1);
            border: 2px solid rgba(139, 92, 246, 0.3);
            display: none;
        }

        .result.show {
            display: block;
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-icon {
            position: relative;
        }

        .input-icon::before {
            content: '';
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            z-index: 1;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 640px) {
            body {
                padding: 10px;
            }
            
            .container {
                padding: 25px 20px;
                margin: 0;
                border-radius: 20px;
            }
            
            h1 {
                font-size: 1.7rem;
                margin-bottom: 20px;
            }
            
            .form-row {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            form {
                gap: 15px;
            }

            input, select {
                padding: 12px 14px;
                font-size: 0.9rem;
            }

            button {
                padding: 14px;
                font-size: 0.95rem;
            }

            .section-title {
                font-size: 1rem;
                margin: 20px 0 12px 0;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px 15px;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            input, select {
                padding: 11px 12px;
            }
            
            button {
                padding: 12px;
            }
        }

        @media (max-width: 360px) {
            h1 {
                font-size: 1.4rem;
            }
            
            .container {
                padding: 18px 12px;
            }
        }

        .section-title {
            color: #e2e8f0;
            font-size: 1.05rem;
            font-weight: 700;
            margin: 22px 0 12px 0;
            padding-bottom: 8px;
            border-bottom: 2px solid rgba(139, 92, 246, 0.3);
        }

        .section-title:first-of-type {
            margin-top: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Churn Prediction</h1>
        <form id="predictionForm">
            <div class="section-title">Personal Information</div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="creditScore">Credit Score:</label>
                    <input type="number" id="creditScore" placeholder="e.g., 600" required>
                </div>
                
                <div class="form-group">
                    <label for="age">Age:</label>
                    <input type="number" id="age" placeholder="e.g., 40" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="geography">Geography:</label>
                    <select id="geography" required>
                        <option value="France">France</option>
                        <option value="Spain">Spain</option>
                        <option value="Germany">Germany</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="gender">Gender:</label>
                    <select id="gender" required>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
            </div>

            <div class="section-title">Account Details</div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="tenure">Tenure (years):</label>
                    <input type="number" id="tenure" placeholder="e.g., 3" required>
                </div>
                
                <div class="form-group">
                    <label for="numOfProducts">Number of Products:</label>
                    <input type="number" id="numOfProducts" placeholder="e.g., 2" required>
                </div>
            </div>

            <div class="form-group">
                <label for="balance">Account Balance:</label>
                <input type="number" id="balance" placeholder="e.g., 60000" required>
            </div>

            <div class="form-group">
                <label for="estimatedSalary">Estimated Annual Salary:</label>
                <input type="number" id="estimatedSalary" placeholder="e.g., 50000" required>
            </div>

            <div class="section-title">Membership Status</div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="hasCrCard">Has Credit Card:</label>
                    <select id="hasCrCard" required>
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="isActiveMember">Is Active Member:</label>
                    <select id="isActiveMember" required>
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>
            </div>

            <button type="submit">Predict Churn Risk</button>
        </form>
        <div class="result" id="result"></div>
    </div>

    <script>
        document.getElementById('predictionForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            // Adjusted one-hot encoding for Geography (drop 'France')
            const geography = document.getElementById('geography').value;
            const geographyOneHot = [
                geography === 'Spain' ? 1 : 0,  // Spain
                geography === 'Germany' ? 1 : 0 // Germany
            ];

            // Adjusted one-hot encoding for Gender (drop 'Female')
            const gender = document.getElementById('gender').value;
            const genderOneHot = [
                gender === 'Male' ? 1 : 0 // Male
            ];

            // Convert 'Has Credit Card' and 'Is Active Member' to 1 or 0
            const hasCrCard = document.getElementById('hasCrCard').value === 'Yes' ? 1 : 0;
            const isActiveMember = document.getElementById('isActiveMember').value === 'Yes' ? 1 : 0;

            const featuresArray = [
                Number(document.getElementById('creditScore').value),
                ...geographyOneHot,
                ...genderOneHot,
                Number(document.getElementById('age').value),
                Number(document.getElementById('tenure').value),
                Number(document.getElementById('balance').value),
                Number(document.getElementById('numOfProducts').value),
                hasCrCard,
                isActiveMember,
                Number(document.getElementById('estimatedSalary').value)
            ];

            // Show loading state
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = 'Analyzing...';
            resultDiv.classList.add('show');

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ features: featuresArray })
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.textContent = `Prediction: ${data.prediction}`;
                } else {
                    resultDiv.textContent = `Error: ${data.error}`;
                }
            } catch (error) {
                resultDiv.textContent = `Error: ${error.message}`;
            }
        });
    </script>
</body>
</html>
